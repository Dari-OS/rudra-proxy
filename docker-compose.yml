services:
  rudra-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: rudra-proxy:latest
    pull_policy: build
    container_name: rudra-proxy
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - RUDRA_HOST=0.0.0.0
      - RUDRA_PORT=11434
      - RUDRA_SYNC_INTERVAL_MINS=30
    # Optional: To use a custom configuration file, copy rudra.toml.example to rudra.toml and uncomment:
    # volumes:
    #   - ./rudra.toml:/app/rudra.toml:ro
