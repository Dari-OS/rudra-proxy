services:
  rudra-proxy:
    image: rudra-proxy:latest
    build: .
    container_name: rudra-proxy
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - RUDRA_HOST=0.0.0.0
      - RUDRA_PORT=11434
      - RUDRA_SYNC_INTERVAL_MINS=30
    volumes:
      - ./rudra.toml:/app/rudra.toml:ro
